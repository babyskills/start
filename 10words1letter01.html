 function resetAndAnimateCheckmark() {
     const oldIcon = document.querySelector('.title-container .checkmark-icon');
     const newIcon = oldIcon.cloneNode(true);
     oldIcon.parentNode.replaceChild(newIcon, oldIcon);
     checkmarkIcon = newIcon;
     const newCircleAnim = newIcon.querySelector('circle animate');
     const newPathAnim = newIcon.querySelector('path animate');
     newCircleAnim.beginElement();
     setTimeout(() => newPathAnim.beginElement(), 600);
 }

 function updateTitle() {
     const wordForm = getWordForm(requiredCount);
     mainTitle.innerHTML = `Напиши ${requiredCount} ${wordForm},<br>которые начинаются<br><span class="letter-part">на букву ${currentLetter}</span>`;
     mainTitle.classList.remove('completed');
 }

 function playSuccessSound() {
     successSound.currentTime = 0;
     successSound.play().catch(e => console.log("Audio play failed:", e));
 }

 function playFinSound() {
     finSound.currentTime = 0;
     finSound.play().catch(e => console.log("Audio play failed:", e));
 }

 function addWordTag(word) {
     const tag = document.createElement('span');
     tag.className = 'word-tag';
     tag.textContent = word;
     wordsContainer.appendChild(tag);
 }

 function checkWord(word) {
     const normalizedWord = word.toLowerCase().trim();
     return currentWords.some(w => w.toLowerCase() === normalizedWord);
 }

 function handleInput() {
     const value = wordInput.value.trim();
     if (value === '') {
         wordInput.classList.remove('incorrect');
         return;
     }

     const isCorrectWord = checkWord(value);
     const isAlreadyEntered = enteredWords.some(w => w.toLowerCase() === value.toLowerCase());

     if (isCorrectWord && !isAlreadyEntered) {
         enteredWords.push(value.toLowerCase());
         addWordTag(value);
         playSuccessSound();
         checkmarkIcon.style.display = 'block';
         resetAndAnimateCheckmark();
         wordInput.value = '';
         wordInput.classList.remove('incorrect');

         if (enteredWords.length >= requiredCount) {
             allDone = true;
             wordInput.disabled = true;
             mainTitle.classList.add('completed');
             nextBtn.style.display = 'flex';
         }
     } else {
         wordInput.classList.add('incorrect');
     }
 }

 function nextTask() {
     usedLetters.add(currentLetter);
     tasksCompleted++;

     if (tasksCompleted >= totalTasks) {
         allTasksCompleted = true;
         sliderContainer.style.display = 'none';
         completionMessage.style.display = 'block';
         finalCheckmarkIcon.style.display = 'block';
         playFinSound();
         return;
     }

     const availableLetters = letters.filter(l => !usedLetters.has(l));
     currentLetter = availableLetters[Math.floor(Math.random() * availableLetters.length)];
     currentWords = [...wordLists[currentLetter]];
     requiredCount = lettersWithThreeWords.includes(currentLetter) ? 3 : 5;
     requiredCount = Math.min(requiredCount, currentWords.length);
     enteredWords = [];
     allDone = false;
     nextBtn.style.display = 'none';
     wordsContainer.innerHTML = '';
     wordInput.value = '';
     wordInput.classList.remove('incorrect');
     wordInput.disabled = false;
     updateTitle();
     wordInput.focus();
 }

 // События
 wordInput.addEventListener('blur', () => {
     handleInput();
 });
 wordInput.addEventListener('keydown', (e) => {
     if (e.key === 'Enter') {
         handleInput();
         if (allDone) {
             nextTask();
         }
     }
 });
 wordInput.addEventListener('input', () => {
     wordInput.classList.remove('incorrect');
     const value = wordInput.value.trim();
     if (value !== '') {
         const isCorrectWord = checkWord(value);
         const isAlreadyEntered = enteredWords.some(w => w.toLowerCase() === value.toLowerCase());
         if (isCorrectWord && !isAlreadyEntered) {
             handleInput();
         }
     }
 });
 nextBtn.addEventListener('click', nextTask);

 // Инициализация
 updateTitle();
 wordInput.focus();
 </script>
</body>
