 function shuffleArray(array) {
    const newArr = [...array];
    for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
    }
    return newArr;
 }

 function getRemainingText(count) {
    if (count === 0) return "Все задания выполнены!";
    const mod10 = count % 10;
    const mod100 = count % 100;
    if (mod100 >= 11 && mod100 <= 14) return `Осталось ${count} слов`;
    if (mod10 === 1) return `Осталось ${count} слово`;
    if (mod10 >= 2 && mod10 <= 4) return `Осталось ${count} слова`;
    return `Осталось ${count} слов`;
 }

 const view = document.getElementById('slider-view');

 const imageTitleElement = document.getElementById('image-title');
 const nextBtn = document.getElementById('next-btn');
 let checkmarkIcon = document.querySelector('.checkmark-icon');
 let currentIndex = 0;
 let allDone = false;
 let currentInputField = null;

 function resetAndAnimateCheckmark() {
    const oldIcon = document.querySelector('.checkmark-icon');
    const newIcon = oldIcon.cloneNode(true);
    oldIcon.parentNode.replaceChild(newIcon, oldIcon);
    checkmarkIcon = newIcon;
    const newCircleAnim = newIcon.querySelector('circle animate');
    const newPathAnim = newIcon.querySelector('path animate');
    newCircleAnim.beginElement();
    setTimeout(() => newPathAnim.beginElement(), 600);
 }

 function updateTitle() {
    if (allDone) {
        imageTitleElement.textContent = "Все задания выполнены!";
        imageTitleElement.style.color = "#3A8443";
    } else {
        const remaining = slides.length - currentIndex;
        imageTitleElement.textContent = getRemainingText(remaining);
        imageTitleElement.style.color = "#303030";
    }
 }

 function showSlide(index) {
    slides.forEach((el, idx) => {
        el.style.display = (idx === index) ? 'flex' : 'none';
    });
    checkmarkIcon.style.display = 'none';
    currentInputField = slides[index].querySelector('.text-field:not([readonly])');
    currentInputField.focus();
    updateTitle();
 }

 function updateView() {
    showSlide(currentIndex);
 }

 function showNext() {
    if (allDone) return;
    const currentInput = slides[currentIndex].querySelector('.text-field:not([readonly])');
    if (!currentInput.classList.contains('correct')) {
        return;
    }
    currentIndex = (currentIndex + 1) % slides.length;
    updateView();
 }

 function checkAnswer(input) {
    const answer = input.getAttribute('data-answer').toLowerCase();
    const userAnswer = input.value.trim().toLowerCase();
    input.classList.remove('correct', 'incorrect');
    if (userAnswer.length > 0) {
        if (userAnswer === answer) {
            input.classList.add('correct');
            checkmarkIcon.style.display = 'block';
            resetAndAnimateCheckmark();
            const allCorrect = Array.from(document.querySelectorAll('.text-field:not([readonly])')).every(field => field.classList.contains('correct'));
            if (allCorrect && currentIndex === slides.length - 1) {
                allDone = true;
                nextBtn.classList.add('disabled');
                updateTitle();
            }
        } else if (!answer.startsWith(userAnswer)) {
            input.classList.add('incorrect');
            checkmarkIcon.style.display = 'none';
        }
    }
 }

 document.addEventListener('keydown', (event) => {
    if ((event.key === 'ArrowRight' || event.key === 'Enter') && !allDone) {
        event.preventDefault();
        const currentInput = slides[currentIndex].querySelector('.text-field:not([readonly])');
        if (currentInput.classList.contains('correct')) {
            showNext();
        }
        currentInput.focus();
    }
 });

 nextBtn.addEventListener('click', showNext);

 window.addEventListener('load', () => {
    // Выбираем 20 случайных уникальных слов для текущей сессии
    const selectedWords = shuffleArray(wordDatabase).slice(0, 20);
    
    // Очищаем контейнер и генерируем слайды динамически
    view.innerHTML = '';
    selectedWords.forEach((word, index) => {
        const fieldSet = document.createElement('div');
        fieldSet.className = 'field-set';
        fieldSet.style.display = index === 0 ? 'flex' : 'none';
        
        const inputSingular = document.createElement('input');
        inputSingular.className = 'text-field';
        inputSingular.type = 'text';
        inputSingular.value = word.singular;
        inputSingular.readOnly = true;
        
        const inputPlural = document.createElement('input');
        inputPlural.className = 'text-field';
        inputPlural.type = 'text';
        inputPlural.placeholder = 'Напечатай здесь';
        inputPlural.setAttribute('data-answer', word.plural);
        
        fieldSet.appendChild(inputSingular);
        fieldSet.appendChild(inputPlural);
        view.appendChild(fieldSet);
    });
    
    // Переинициализируем массив слайдов и навешиваем обработчики
    slides = Array.from(view.querySelectorAll('.field-set'));
    document.querySelectorAll('.text-field:not([readonly])').forEach(input => {
        input.addEventListener('input', () => checkAnswer(input));
    });
    
    updateView();
 });
 </script>
</body>
</html>
